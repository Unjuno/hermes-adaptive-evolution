name: p0b-bounded-two-leaf

on:
  push:
    branches:
      - experiment/p0-runtime-closure
    paths:
      - ".github/workflows/p0b-bounded-two-leaf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bounded-two-leaf:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HERMES_CONTRACT_SHA: b5455fdd16fe608214f91149233660e1836b067c
      MODEL: hf.co/LiquidAI/LFM2.5-2.6B-GGUF:Q4_K_M
      CONTEXT: "98304"
      MAX_TOKENS: "256"
      CHILD_MAX_ITERATIONS: "6"
      CHILD_TIMEOUT_SECONDS: "240"
      ADAPTIVE_EVOLUTION_CAPTURE_CONTENT: "0"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish live run locator
        shell: bash
        run: |
          set -e
          orig="$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan p0b-bounded-live-tmp
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p results/p0b-bounded-two-leaf/live
          printf '{"run_id":"%s","source_sha":"%s","event":"%s"}\n' "$GITHUB_RUN_ID" "$orig" "$GITHUB_EVENT_NAME" > results/p0b-bounded-two-leaf/live/status.json
          git add -- results/p0b-bounded-two-leaf/live/status.json
          git commit -m "Publish P0b live run ${GITHUB_RUN_ID}"
          git push --force origin HEAD:p0b-bounded-two-leaf-live
          git checkout --force "$orig"

      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: b5455fdd16fe608214f91149233660e1836b067c
          path: _hermes
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Hermes and observer
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _hermes rev-parse HEAD)" = "$HERMES_CONTRACT_SHA"
          python -m pip install -e ./_hermes
          python -m pip install -e .

      - name: Start controlled Ollama
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p0b/logs
          curl -fsSL https://ollama.com/install.sh | sh
          ollama --version | tee p0b/logs/ollama-version.txt
          sudo systemctl stop ollama.service || true
          sudo systemctl disable ollama.service || true
          sudo pkill -x ollama || true
          for i in $(seq 1 30); do
            if ! curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then break; fi
            sleep 1
          done
          if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
            echo "old Ollama listener still active" >&2
            exit 1
          fi
          env OLLAMA_CONTEXT_LENGTH="$CONTEXT" OLLAMA_NUM_PARALLEL=1 OLLAMA_MAX_LOADED_MODELS=1 nohup ollama serve > p0b/logs/ollama-serve.log 2>&1 &
          echo $! > p0b/ollama.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          kill -0 "$(cat p0b/ollama.pid)"
          tr '\0' '\n' < "/proc/$(cat p0b/ollama.pid)/environ" | grep '^OLLAMA_' | sort | tee p0b/logs/ollama-environment.txt

      - name: Pull model and verify route context
        shell: bash
        run: |
          set -euo pipefail
          ollama pull "$MODEL"
          python - <<'PY'
          import json, os, urllib.request
          model=os.environ['MODEL']; ctx=int(os.environ['CONTEXT'])
          data=json.dumps({'model':model,'messages':[{'role':'user','content':'Reply exactly OK.'}], 'stream':False,'max_tokens':8,'temperature':0.0}).encode()
          req=urllib.request.Request('http://127.0.0.1:11434/v1/chat/completions',data=data,headers={'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=900) as r: print(r.read().decode())
          with urllib.request.urlopen('http://127.0.0.1:11434/api/ps',timeout=30) as r: ps=json.load(r)
          got=int((ps.get('models') or [{}])[0].get('context_length') or 0)
          open('p0b/route-context.txt','w').write(f'{got}\n')
          if got < ctx: raise SystemExit(f'context {got} < {ctx}')
          PY

      - name: Configure bounded Hermes profile
        shell: bash
        run: |
          set -euo pipefail
          export HERMES_HOME="${RUNNER_TEMP}/hermes-p0b-bounded"
          mkdir -p "$HERMES_HOME"
          cat > "$HERMES_HOME/config.yaml" <<EOF
          model:
            default: "$MODEL"
            provider: custom
            base_url: "http://127.0.0.1:11434/v1"
            context_length: $CONTEXT
            ollama_num_ctx: $CONTEXT
            max_tokens: $MAX_TOKENS
            reasoning:
              enabled: false
          terminal:
            cwd: "${GITHUB_WORKSPACE}"
          plugins:
            enabled:
              - adaptive-evolution
          delegation:
            max_concurrent_children: 1
            subagent_auto_approve: false
            max_iterations: $CHILD_MAX_ITERATIONS
            child_timeout_seconds: $CHILD_TIMEOUT_SECONDS
          EOF
          echo "HERMES_HOME=$HERMES_HOME" >> "$GITHUB_ENV"
          echo "ADAPTIVE_EVOLUTION_OBSERVER_DB=${RUNNER_TEMP}/p0b-bounded.sqlite3" >> "$GITHUB_ENV"

      - name: Run bounded two-leaf terminal case
        id: hermes
        continue-on-error: true
        shell: bash
        run: |
          set +e
          start=$(date +%s)
          timeout 660s hermes -t terminal,delegation chat \
            -q 'P0b bounded case. Use delegate_task exactly twice, sequentially, with two distinct leaf subagents. First child must use the terminal exactly once to run python -c "print('\''LEAF_A_OK'\'')", then return exactly the observed marker. Wait for it to finish. Second child must use the terminal exactly once to run python -c "print('\''LEAF_B_OK'\'')", then return exactly the observed marker. Wait for it to finish. Then answer exactly ROOT_OK. Do not use the terminal yourself. Do not inspect or edit files. Do not do anything else.' \
            -Q --max-turns 10 --source adaptive-evolution-p0b-bounded \
            > p0b/hermes-output.txt 2> p0b/logs/hermes-run.log
          rc=$?
          end=$(date +%s)
          set -e
          echo "$rc" > p0b/hermes-rc.txt
          echo "$((end-start))" > p0b/wall-seconds.txt

      - name: Bundle and evaluate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p0b/result
          set +e
          adaptive-evolution-observer --db "$ADAPTIVE_EVOLUTION_OBSERVER_DB" bundle p0b/capture > p0b/logs/bundle.log 2>&1
          echo $? > p0b/bundle-rc.txt
          set -e
          python - <<'PY'
          import json, os
          from collections import Counter
          from pathlib import Path
          from datetime import datetime, timezone
          root=Path('p0b')
          def ri(name):
              try:return int((root/name).read_text().strip())
              except:return None
          def rt(name):
              p=root/name
              return p.read_text(errors='replace') if p.exists() else ''
          events=[]
          p=root/'capture'/'normalized-events.jsonl'
          if p.exists():
              for line in p.read_text().splitlines():
                  if line.strip():
                      try:events.append(json.loads(line))
                      except:pass
          starts=[e for e in events if e.get('kind')=='interaction_start']
          stops=[e for e in events if e.get('kind')=='interaction_stop']
          tools=[e for e in events if e.get('kind')=='tool_result']
          hist=Counter(str((e.get('data') or {}).get('tool_name') or 'unknown') for e in tools)
          rc=ri('hermes-rc.txt'); wall=ri('wall-seconds.txt')
          combined=(rt('hermes-output.txt')+'\n'+rt('logs/hermes-run.log')).lower()
          observer_complete=len(starts)>=2 and len(stops)>=2
          clean_exit=rc==0
          if clean_exit and observer_complete:
              cls='bounded_two_leaf_clean_exit'
          elif observer_complete:
              cls='bounded_observer_complete_runtime_failure'
          elif 'max_iterations' in combined or 'truncated' in combined:
              cls='bounded_iteration_cap_reached'
          elif 'timeout' in combined or rc==124:
              cls='bounded_timeout_before_complete'
          else:
              cls='bounded_runtime_failure_before_complete'
          s={
            'schema':'adaptive-evolution.p0b-bounded-two-leaf.v0.1',
            'authority':'provider_backed_runtime_intervention',
            'created_at':datetime.now(timezone.utc).isoformat(),
            'run_id':os.environ['GITHUB_RUN_ID'],
            'source_sha':os.environ['GITHUB_SHA'],
            'model':os.environ['MODEL'],
            'context':int(os.environ['CONTEXT']),
            'child_max_iterations':int(os.environ['CHILD_MAX_ITERATIONS']),
            'child_timeout_seconds':int(os.environ['CHILD_TIMEOUT_SECONDS']),
            'route_context':ri('route-context.txt'),
            'hermes_exit_code':rc,
            'wall_seconds':wall,
            'interaction_starts':len(starts),
            'interaction_stops':len(stops),
            'observer_complete':observer_complete,
            'clean_exit':clean_exit,
            'context_error_detected':'context length exceeded' in combined,
            'tool_histogram':dict(sorted(hist.items())),
            'classification':cls,
            'hermes_output_tail':rt('hermes-output.txt')[-2000:],
            'hermes_stderr_tail':rt('logs/hermes-run.log')[-2000:],
          }
          (root/'result'/'status.json').write_text(json.dumps(s,indent=2,sort_keys=True)+'\n')
          print(json.dumps(s,indent=2,sort_keys=True))
          PY

      - name: Publish result branch
        if: always()
        shell: bash
        run: |
          set -e
          tmp="${RUNNER_TEMP}/p0b-result"
          rm -rf "$tmp" && mkdir -p "$tmp"
          cp -a p0b/result/. "$tmp/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan p0b-bounded-results-tmp
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p results/p0b-bounded-two-leaf/latest
          cp -a "$tmp/." results/p0b-bounded-two-leaf/latest/
          git add -- results/p0b-bounded-two-leaf/latest
          git commit -m "Publish P0b bounded two-leaf result ${GITHUB_RUN_ID}"
          git push --force origin HEAD:p0b-bounded-two-leaf-results
