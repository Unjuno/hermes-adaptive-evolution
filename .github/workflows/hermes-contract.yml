name: hermes-contract

on:
  push:
    branches: [main]
    paths:
      - "adaptive_evolution_observer/**"
      - "pyproject.toml"
      - "plugin.yaml"
      - "scripts/check_hermes_contract.py"
      - ".github/workflows/hermes-contract.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  current-hermes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install plugin and pinned Hermes contract target
        run: |
          python -m pip install -e .
          python -m pip install 'hermes-agent==0.20.4'
      - name: Validate real Hermes plugin contract
        run: python scripts/check_hermes_contract.py
