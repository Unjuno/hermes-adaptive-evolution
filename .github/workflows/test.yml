name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Unit tests
        run: python -m pytest
      - name: Compile
        run: python -m compileall -q adaptive_evolution_observer __init__.py
      - name: Build wheel
        run: python -m pip wheel --no-deps --no-build-isolation . -w dist

  publish-ci-result:
    if: always() && github.event_name == 'push'
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build result
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        shell: bash
        run: |
          mkdir -p ci-result
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          result={
              'schema':'adaptive-evolution.ci-result.v0.1',
              'created_at':datetime.now(timezone.utc).isoformat(),
              'source_sha':os.environ['GITHUB_SHA'],
              'run_id':os.environ['GITHUB_RUN_ID'],
              'python_matrix':['3.11','3.13'],
              'matrix_result':os.environ['MATRIX_RESULT'],
              'passed':os.environ['MATRIX_RESULT']=='success',
          }
          Path('ci-result/status.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2,sort_keys=True))
          PY
      - name: Publish ci-results branch
        shell: bash
        run: |
          set -e
          tmp="${RUNNER_TEMP}/ci-result"
          mkdir -p "$tmp"
          cp ci-result/status.json "$tmp/status.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan ci-results-tmp
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p results/ci/latest
          cp "$tmp/status.json" results/ci/latest/status.json
          git add results/ci/latest/status.json
          git commit -m "Record CI result for ${GITHUB_SHA::12}"
          git push --force origin HEAD:ci-results
