name: qwen3-4b-e1-96k

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/qwen3-4b-e1-96k.yml"
      - "adaptive_evolution_observer/**"
      - "experiments/validate_e1_capture.py"
      - "experiments/report_hook_coverage.py"
      - "experiments/run_capture_corruption.py"
      - "experiments/fixtures/e1_repair_project/**"
      - "plugin.yaml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qwen3-4b-96k-e1:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HERMES_CONTRACT_SHA: b5455fdd16fe608214f91149233660e1836b067c
      E1_MODEL: qwen3:4b-instruct
      E1_CONTEXT: "98304"
      E1_MAX_TOKENS: "2048"
      ADAPTIVE_EVOLUTION_CAPTURE_CONTENT: "0"
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: b5455fdd16fe608214f91149233660e1836b067c
          path: _hermes
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Hermes and observer
        id: install
        continue-on-error: true
        run: |
          mkdir -p qwen-e1-artifact/logs
          test "$(git -C _hermes rev-parse HEAD)" = "$HERMES_CONTRACT_SHA"
          python -m pip install -e ./_hermes 2>&1 | tee qwen-e1-artifact/logs/hermes-install.log
          python -m pip install -e . 2>&1 | tee qwen-e1-artifact/logs/plugin-install.log

      - name: Start Ollama
        id: ollama_install
        continue-on-error: true
        run: |
          set -o pipefail
          curl -fsSL https://ollama.com/install.sh | sh
          OLLAMA_CONTEXT_LENGTH="$E1_CONTEXT" OLLAMA_NUM_PARALLEL=1 OLLAMA_MAX_LOADED_MODELS=1 \
            nohup ollama serve > qwen-e1-artifact/logs/ollama-serve.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:11434/api/tags >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Pull and preload Qwen3 4B Q4
        id: model_preload
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          ollama pull "$E1_MODEL" 2>&1 | tee qwen-e1-artifact/logs/model-pull.log
          python - <<'PY' 2>&1 | tee qwen-e1-artifact/logs/model-preload.log
          import json, os, urllib.request
          model=os.environ['E1_MODEL']; ctx=int(os.environ['E1_CONTEXT'])
          payload=json.dumps({'model':model,'messages':[{'role':'user','content':'Reply with OK.'}], 'stream':False,'keep_alive':'30m','options':{'num_ctx':ctx,'temperature':0.0}}).encode()
          req=urllib.request.Request('http://127.0.0.1:11434/api/chat',data=payload,headers={'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=900) as r: print(json.dumps(json.load(r),indent=2)[:2000])
          with urllib.request.urlopen('http://127.0.0.1:11434/api/ps',timeout=30) as r: ps=json.load(r)
          print(json.dumps(ps,indent=2,sort_keys=True))
          loaded=(ps.get('models') or [None])[0]
          if not loaded: raise SystemExit('no loaded model')
          runtime_ctx=int(loaded.get('context_length') or 0)
          if runtime_ctx < ctx: raise SystemExit(f'runtime context too small: {runtime_ctx} < {ctx}')
          PY

      - name: Configure Hermes
        id: configure
        continue-on-error: true
        shell: bash
        run: |
          export HERMES_HOME="${RUNNER_TEMP}/hermes-qwen96-e1"
          mkdir -p "$HERMES_HOME"
          cat > "$HERMES_HOME/config.yaml" <<EOF
          model:
            default: "$E1_MODEL"
            provider: custom
            base_url: "http://127.0.0.1:11434/v1"
            context_length: $E1_CONTEXT
            ollama_num_ctx: $E1_CONTEXT
            max_tokens: $E1_MAX_TOKENS
            reasoning:
              enabled: false
          terminal:
            cwd: "${GITHUB_WORKSPACE}/experiments/fixtures/e1_repair_project"
          plugins:
            enabled:
              - adaptive-evolution
          delegation:
            max_concurrent_children: 1
            subagent_auto_approve: false
          EOF
          echo "HERMES_HOME=$HERMES_HOME" >> "$GITHUB_ENV"
          echo "ADAPTIVE_EVOLUTION_OBSERVER_DB=${RUNNER_TEMP}/qwen96-e1-observer.sqlite3" >> "$GITHUB_ENV"

      - name: Baseline must fail
        id: baseline
        continue-on-error: true
        run: |
          cd experiments/fixtures/e1_repair_project
          ! python -m unittest -q > "${GITHUB_WORKSPACE}/qwen-e1-artifact/logs/baseline.log" 2>&1

      - name: Run Hermes E1
        id: hermes_run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          prompt='This is an E1 observability fixture. Use delegate_task exactly once with a leaf subagent. Ask the child to reproduce the failing unittest before editing, fix the root cause with the smallest change in counter.py only, run python -m unittest -q after the patch, and return the evidence. Do not modify the tests. After the child returns, inspect the result and report whether the test transitioned from failing to passing.'
          cd experiments/fixtures/e1_repair_project
          start="$(date +%s)"
          timeout 1200s hermes -t terminal,file,delegation chat -q "$prompt" -Q --max-turns 16 --source adaptive-evolution-qwen96-e1 \
            > "${GITHUB_WORKSPACE}/qwen-e1-artifact/hermes-output.txt" \
            2> "${GITHUB_WORKSPACE}/qwen-e1-artifact/logs/hermes-run.log"
          rc=$?; end="$(date +%s)"
          echo "wall_seconds=$((end-start))" > "${GITHUB_WORKSPACE}/qwen-e1-artifact/hermes-timing.txt"
          exit "$rc"

      - name: Verify repair
        id: repair_verify
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cd experiments/fixtures/e1_repair_project
          python -m unittest -q 2>&1 | tee "${GITHUB_WORKSPACE}/qwen-e1-artifact/logs/final-test.log"
          git diff -- counter.py test_counter.py > "${GITHUB_WORKSPACE}/qwen-e1-artifact/fixture.diff"
          changed="$(git diff --name-only --relative -- .)"
          test "$changed" = "counter.py"

      - name: Bundle and validate
        id: validate
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -e
          test -f "$ADAPTIVE_EVOLUTION_OBSERVER_DB"
          adaptive-evolution-observer --db "$ADAPTIVE_EVOLUTION_OBSERVER_DB" bundle qwen-e1-artifact/capture
          python experiments/validate_e1_capture.py qwen-e1-artifact/capture --output qwen-e1-artifact/e1-validation.json
          python experiments/report_hook_coverage.py qwen-e1-artifact/capture --output qwen-e1-artifact/hook-coverage.json
          python experiments/run_capture_corruption.py qwen-e1-artifact/capture --replicates 20 --output qwen-e1-artifact/corruption-summary.json

      - name: Summarize
        id: summarize
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          OLLAMA_INSTALL: ${{ steps.ollama_install.outcome }}
          MODEL_PRELOAD: ${{ steps.model_preload.outcome }}
          CONFIGURE: ${{ steps.configure.outcome }}
          BASELINE: ${{ steps.baseline.outcome }}
          HERMES_RUN: ${{ steps.hermes_run.outcome }}
          REPAIR_VERIFY: ${{ steps.repair_verify.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
        run: |
          mkdir -p results/qwen3-4b-e1-96k/latest
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          src=Path('qwen-e1-artifact'); dst=Path('results/qwen3-4b-e1-96k/latest')
          outcomes={k.lower():os.environ[k] for k in ('INSTALL','OLLAMA_INSTALL','MODEL_PRELOAD','CONFIGURE','BASELINE','HERMES_RUN','REPAIR_VERIFY','VALIDATE')}
          status={
            'schema':'adaptive-evolution.qwen3-4b-e1-96k.v0.1','created_at':datetime.now(timezone.utc).isoformat(),
            'source_sha':os.environ['GITHUB_SHA'],'run_id':os.environ['GITHUB_RUN_ID'],'hermes_contract_sha':os.environ['HERMES_CONTRACT_SHA'],
            'provider':'ollama-local','model':os.environ['E1_MODEL'],'context_length':int(os.environ['E1_CONTEXT']),
            'max_tokens':int(os.environ['E1_MAX_TOKENS']),'external_api_credentials_used':False,'outcomes':outcomes,
            'critical_gate_passed':all(v=='success' for v in outcomes.values()),'authority':'provider_backed_e1_contract',
            'note':'Fair-context Qwen3 4B comparison against LFM2.5 E1; not a general coding benchmark.'}
          timing=src/'hermes-timing.txt'
          if timing.exists():
            try: status['hermes_wall_seconds']=int(timing.read_text().strip().split('=',1)[1])
            except Exception: pass
          (dst/'status.json').write_text(json.dumps(status,indent=2,sort_keys=True)+'\n')
          for name in ('e1-validation.json','hook-coverage.json','fixture.diff'):
            p=src/name
            if p.exists(): (dst/name).write_bytes(p.read_bytes())
          corr=src/'corruption-summary.json'
          if corr.exists():
            d=json.loads(corr.read_text()); compact={k:d.get(k) for k in ('schema','baseline','summary','authority','note')}
            (dst/'corruption-compact.json').write_text(json.dumps(compact,indent=2,sort_keys=True)+'\n')
          logs=dst/'logs'; logs.mkdir(exist_ok=True)
          for p in sorted((src/'logs').glob('*.log')):
            lines=p.read_text(errors='replace').splitlines(); (logs/p.name).write_text('\n'.join(lines[-180:])+'\n')
          out=src/'hermes-output.txt'
          if out.exists(): (dst/'hermes-output-tail.txt').write_text(out.read_text(errors='replace')[-4000:])
          PY

      - name: Publish result branch
        id: publish
        if: always()
        run: |
          set -e
          tmp="${RUNNER_TEMP}/qwen96-result"; mkdir -p "$tmp"
          cp -a results/qwen3-4b-e1-96k/latest/. "$tmp/"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan qwen96-results-tmp
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p results/qwen3-4b-e1-96k/latest
          cp -a "$tmp"/. results/qwen3-4b-e1-96k/latest/
          git add results/qwen3-4b-e1-96k/latest
          git commit -m "Record Qwen3 4B 96K E1 for ${GITHUB_SHA::12}"
          git push --force origin HEAD:qwen3-4b-e1-96k-results

      - name: Enforce gate
        if: always()
        env:
          INSTALL: ${{ steps.install.outcome }}
          OLLAMA_INSTALL: ${{ steps.ollama_install.outcome }}
          MODEL_PRELOAD: ${{ steps.model_preload.outcome }}
          CONFIGURE: ${{ steps.configure.outcome }}
          BASELINE: ${{ steps.baseline.outcome }}
          HERMES_RUN: ${{ steps.hermes_run.outcome }}
          REPAIR_VERIFY: ${{ steps.repair_verify.outcome }}
          VALIDATE: ${{ steps.validate.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
        run: |
          python - <<'PY'
          import os
          names=('INSTALL','OLLAMA_INSTALL','MODEL_PRELOAD','CONFIGURE','BASELINE','HERMES_RUN','REPAIR_VERIFY','VALIDATE','PUBLISH')
          failed=[n.lower() for n in names if os.environ[n]!='success']
          if failed: raise SystemExit(f'Qwen3 4B 96K E1 failed: {failed}')
          print('Qwen3 4B 96K E1 passed')
          PY
