name: p0c-v2-api-readiness

on:
  push:
    branches:
      - experiment/p0-runtime-closure
    paths:
      - ".github/workflows/p0c-v2-api-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HERMES_CONTRACT_SHA: b5455fdd16fe608214f91149233660e1836b067c
      MODEL: hf.co/LiquidAI/LFM2.5-2.6B-GGUF:Q4_K_M
      CONTEXT: "98304"
      MAX_TOKENS: "128"
      API_SERVER_KEY: p0c-v2-local-key

    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: b5455fdd16fe608214f91149233660e1836b067c
          path: _hermes
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install pinned Hermes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _hermes rev-parse HEAD)" = "$HERMES_CONTRACT_SHA"
          python -m pip install -e ./_hermes
          hermes --version || true

      - name: Start controlled Ollama
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p p0c-v2/logs
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama.service || true
          sudo systemctl disable ollama.service || true
          sudo pkill -x ollama || true
          for i in $(seq 1 30); do
            if ! curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then break; fi
            sleep 1
          done
          if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
            echo "old Ollama listener still active" >&2
            exit 1
          fi
          env OLLAMA_CONTEXT_LENGTH="$CONTEXT" OLLAMA_NUM_PARALLEL=1 OLLAMA_MAX_LOADED_MODELS=1 nohup ollama serve > p0c-v2/logs/ollama-serve.log 2>&1 &
          echo $! > p0c-v2/ollama.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:11434/api/tags >/dev/null
          kill -0 "$(cat p0c-v2/ollama.pid)"
          ollama --version | tee p0c-v2/logs/ollama-version.txt

      - name: Pull model and verify 98K effective context
        shell: bash
        run: |
          set -euo pipefail
          ollama pull "$MODEL"
          python - <<'PY'
          import json, os, urllib.request
          model=os.environ['MODEL']; target=int(os.environ['CONTEXT'])
          body=json.dumps({
              'model': model,
              'messages':[{'role':'user','content':'Reply exactly OK.'}],
              'stream':False,
              'max_tokens':8,
              'temperature':0.0,
          }).encode()
          req=urllib.request.Request('http://127.0.0.1:11434/v1/chat/completions',data=body,headers={'Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=900) as r:
              print(r.read().decode())
          with urllib.request.urlopen('http://127.0.0.1:11434/api/ps',timeout=30) as r:
              ps=json.load(r)
          got=int((ps.get('models') or [{}])[0].get('context_length') or 0)
          open('p0c-v2/effective-context.txt','w').write(str(got)+'\n')
          print('effective_context=',got)
          if got < target:
              raise SystemExit(f'effective context {got} < target {target}')
          PY

      - name: Configure Hermes at canonical home
        shell: bash
        run: |
          set -euo pipefail
          # P0c used HERMES_HOME, but the pinned gateway reads ~/.hermes.
          # Put configuration at the documented canonical path and also pass
          # API_SERVER_* directly to the gateway process to remove ambiguity.
          mkdir -p "$HOME/.hermes"
          cat > "$HOME/.hermes/config.yaml" <<EOF
          model:
            default: "$MODEL"
            provider: custom
            base_url: "http://127.0.0.1:11434/v1"
            context_length: $CONTEXT
            ollama_num_ctx: $CONTEXT
            max_tokens: $MAX_TOKENS
            reasoning:
              enabled: false
          toolsets:
            - terminal
            - delegation
          terminal:
            cwd: "${GITHUB_WORKSPACE}"
          delegation:
            max_concurrent_children: 1
            subagent_auto_approve: false
            max_iterations: 8
            child_timeout_seconds: 300
          EOF
          cat > "$HOME/.hermes/.env" <<EOF
          API_SERVER_ENABLED=true
          API_SERVER_KEY=$API_SERVER_KEY
          EOF
          echo '--- ~/.hermes/config.yaml ---'
          cat "$HOME/.hermes/config.yaml"
          echo '--- ~/.hermes/.env (key redacted) ---'
          sed 's/API_SERVER_KEY=.*/API_SERVER_KEY=<redacted>/' "$HOME/.hermes/.env"

      - name: Gate 1 - gateway process and health
        shell: bash
        run: |
          set -euo pipefail
          env API_SERVER_ENABLED=true API_SERVER_KEY="$API_SERVER_KEY" nohup hermes gateway > p0c-v2/logs/gateway.log 2>&1 &
          echo $! > p0c-v2/gateway.pid
          sleep 2
          if ! kill -0 "$(cat p0c-v2/gateway.pid)" 2>/dev/null; then
            echo 'gateway exited before readiness' >&2
            cat p0c-v2/logs/gateway.log >&2 || true
            exit 1
          fi
          ready=0
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8642/health > p0c-v2/logs/health.json 2>/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$(cat p0c-v2/gateway.pid)" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo 'gateway health did not become ready' >&2
            cat p0c-v2/logs/gateway.log >&2 || true
            exit 1
          fi
          cat p0c-v2/logs/health.json
          kill -0 "$(cat p0c-v2/gateway.pid)"

      - name: Gate 2 - authenticated capabilities
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o p0c-v2/logs/capabilities.json -w '%{http_code}' \
            -H "Authorization: Bearer $API_SERVER_KEY" \
            http://127.0.0.1:8642/v1/capabilities)
          echo "capabilities_http=$code"
          cat p0c-v2/logs/capabilities.json
          test "$code" = 200

      - name: Gate 3 - trivial root Runs API smoke
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          from pathlib import Path

          base='http://127.0.0.1:8642'
          key=os.environ['API_SERVER_KEY']
          out=Path('p0c-v2')
          headers={'Authorization':f'Bearer {key}','Content-Type':'application/json'}

          def req(path, method='GET', body=None, timeout=60):
              data=None if body is None else json.dumps(body).encode()
              h={'Authorization':f'Bearer {key}'}
              if data is not None: h['Content-Type']='application/json'
              r=urllib.request.Request(base+path,data=data,headers=h,method=method)
              try:
                  with urllib.request.urlopen(r,timeout=timeout) as resp:
                      raw=resp.read().decode()
                      return resp.status, json.loads(raw) if raw.strip() else {}
              except urllib.error.HTTPError as e:
                  raw=e.read().decode(errors='replace')
                  print('HTTP_ERROR',e.code,path,raw)
                  raise

          code, started=req('/v1/runs','POST',{
              'input':'Reply exactly OK. Do not call any tool.',
              'session_id':'p0c-v2-root-smoke'
          })
          print('start_http=',code,'started=',json.dumps(started,sort_keys=True))
          if code != 202: raise SystemExit(f'expected 202, got {code}')
          rid=started.get('run_id')
          if not rid: raise SystemExit(f'no run_id: {started}')

          transitions=[]; last_status=None; terminal=None
          deadline=time.time()+420
          while time.time()<deadline:
              code,state=req(f'/v1/runs/{rid}',timeout=30)
              s=state.get('status')
              if s != last_status:
                  transitions.append({'t':time.time(),'status':s,'state':state})
                  print('transition=',s,json.dumps(state,sort_keys=True))
                  last_status=s
              if s in {'completed','failed','cancelled'}:
                  terminal=state
                  break
              time.sleep(1)
          if terminal is None:
              raise SystemExit(f'run timeout; transitions={transitions}')

          result={'run_id':rid,'started':started,'transitions':transitions,'terminal':terminal}
          (out/'root-smoke.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          if terminal.get('status') != 'completed':
              raise SystemExit(f'root run not completed: {terminal}')
          text=json.dumps(terminal.get('output') or terminal.get('result') or terminal,ensure_ascii=False)
          if 'OK' not in text:
              raise SystemExit(f'completed but OK not found in terminal payload: {terminal}')
          print('P0C_V2_ROOT_SMOKE_PASS')
          PY

      - name: Summarize P0c-v2
        if: always()
        shell: bash
        run: |
          set -u
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('p0c-v2')
          root={}
          try: root=json.loads((p/'root-smoke.json').read_text())
          except Exception: pass
          gateway=(p/'logs/gateway.log').read_text(errors='replace') if (p/'logs/gateway.log').exists() else ''
          s={
            'effective_context': int((p/'effective-context.txt').read_text().strip()) if (p/'effective-context.txt').exists() else None,
            'gateway_health': (p/'logs/health.json').exists(),
            'capabilities_returned': (p/'logs/capabilities.json').exists(),
            'run_id': root.get('run_id'),
            'terminal_status': (root.get('terminal') or {}).get('status'),
            'gateway_tail': gateway[-3000:],
          }
          (p/'status.json').write_text(json.dumps(s,indent=2,sort_keys=True)+'\n')
          print(json.dumps(s,indent=2,sort_keys=True))
          PY

      - name: Upload P0c-v2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0c-v2-api-readiness-${{ github.run_id }}
          path: p0c-v2
          if-no-files-found: warn

      - name: Stop services
        if: always()
        shell: bash
        run: |
          if test -f p0c-v2/gateway.pid; then kill "$(cat p0c-v2/gateway.pid)" || true; fi
          if test -f p0c-v2/ollama.pid; then kill "$(cat p0c-v2/ollama.pid)" || true; fi
